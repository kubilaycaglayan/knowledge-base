services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-know}
      POSTGRES_USER: ${POSTGRES_USER:-know}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports: ["127.0.0.1:${DB_DEV_PORT:-5432}:5432"]
    volumes: [know-db:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'], interval: 10s, timeout: 5s, retries: 5}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
  api:
    build: ./backend
    ports: ["127.0.0.1:${API_DEV_PORT:-8080}:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-know}
      DATABASE_USERNAME: ${POSTGRES_USER:-know}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5177}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on: [api]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports: ["127.0.0.1:${PROXY_DEV_PORT:-3000}:80", "${PROXY_HTTP_PORT:-80}:80", "${PROXY_HTTPS_PORT:-443}:443"]
    volumes: [./deployment/Caddyfile:/etc/caddy/Caddyfile, caddy-data:/data, caddy-config:/config]
    depends_on: [web, api]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/ | grep -q 'id=\"app\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
volumes: {know-db: {}, caddy-data: {}, caddy-config: {}}
