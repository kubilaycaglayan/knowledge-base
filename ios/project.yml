name: Know
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: $(IOS_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
targets:
  Know:
    type: application
    platform: iOS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    sources:
      - path: Know
        excludes:
          - Info.plist
          - Info-Debug.plist
          - Info-Release.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.know.ios
        PRODUCT_NAME: Know
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_TESTABILITY: YES
      configs:
        Debug:
          INFOPLIST_FILE: Know/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Know/Info-Release.plist
  KnowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowTests
    dependencies:
      - target: Know
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.know.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Know.app/Know"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KnowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KnowUITests
    dependencies:
      - target: Know
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.know.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Know
schemes:
  Know:
    build:
      targets:
        Know: all
        KnowTests: [test]
        KnowUITests: [test]
    test:
      config: Debug
      targets:
        - name: KnowTests
        - name: KnowUITests
