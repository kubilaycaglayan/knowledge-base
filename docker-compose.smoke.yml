services:
  # Smoke requests run through `docker compose exec`, so these disposable
  # services do not need host ports. Avoid colliding with a live dev stack.
  db:
    ports: !override []
    healthcheck:
      # Over TCP: the image's init-time server listens only on the socket, so
      # this cannot report ready before the real server is up. Checked every
      # second while starting instead of every 10s.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 60s
      start_interval: 1s
      retries: 12
  # Disposable stacks build test-only images so they never move the tags that
  # production containers are created from.
  api:
    image: knowledge-base-api:test-only
    ports: !override []
  web:
    image: knowledge-base-web:test-only
  proxy:
    ports: !override
      [
        "127.0.0.1:${PROXY_HTTP_PORT:-26080}:80",
        "127.0.0.1:${PROXY_HTTPS_PORT:-26443}:443",
      ]
  # Production serves the app through Caddyfile.cloudflare, not the main
  # Caddyfile. Full-stack smoke runs it too so its routing (including the
  # timer WebSocket) is exercised before it is deployed.
  proxy-cloudflare:
    image: caddy:2-alpine
    volumes:
      - ./deployment/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:${PROXY_CLOUDFLARE_PORT:-26090}:80"]
    depends_on: [web, api]
