services:
  # Smoke requests run through `docker compose exec`, so these disposable
  # services do not need host ports. Avoid colliding with a live dev stack.
  db:
    ports: !override []
    healthcheck:
      start_period: 60s
      retries: 12
  api:
    ports: !override []
  proxy:
    ports: !override
      [
        "127.0.0.1:${PROXY_HTTP_PORT:-18080}:80",
        "127.0.0.1:${PROXY_HTTPS_PORT:-18443}:443",
      ]
