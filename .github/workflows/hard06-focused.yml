name: HARD-06 full simulator validation

on:
  push:
    branches:
      - feature/hard-06-ios-validation
  workflow_dispatch:

jobs:
  focused-ios-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Run the complete Know scheme
        run: |
          mkdir -p harden-tests/artifacts
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project ios/Know.xcodeproj \
            -scheme Know \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath "$PWD/harden-tests/artifacts/HARD06-full.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Keep simulator result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard06-full-${{ github.run_id }}
          path: harden-tests/artifacts/HARD06-full.xcresult
          if-no-files-found: warn
          retention-days: 14
