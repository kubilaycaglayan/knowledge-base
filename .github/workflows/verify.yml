name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: docker run --rm -v "$PWD/backend:/app" -w /app gradle:8.13-jdk21 gradle test --no-daemon

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: kb_test_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KB_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/kb_test_ci_${{ github.run_id }}_${{ github.run_attempt }}
      KB_TEST_POSTGRES_USER: postgres
      KB_TEST_POSTGRES_PASSWORD: ci-only-database-password
      KB_TEST_POSTGRES_DISPOSABLE: "true"
      KB_TEST_POSTGRES_MODE: empty
    steps:
      - uses: actions/checkout@v4
      - name: Run all backend tests with PostgreSQL integration profile
        run: docker run --rm --network host -e KB_TEST_POSTGRES_URL -e KB_TEST_POSTGRES_USER -e KB_TEST_POSTGRES_PASSWORD -e KB_TEST_POSTGRES_DISPOSABLE -e KB_TEST_POSTGRES_MODE -v "$PWD/backend:/app" -w /app gradle:8.13-jdk21 gradle test --no-daemon
      - name: Print fresh PostgreSQL and Flyway evidence
        run: grep -hE 'PostgreSQL test target:|PostgreSQL version:|PostgreSQL empty-database check:|Successfully applied [0-9]+ migrations' backend/build/test-results/test/*.xml | sort -u
      - name: Validate startup against migrated disposable database
        env:
          KB_TEST_POSTGRES_MODE: migrated
        run: docker run --rm --network host -e KB_TEST_POSTGRES_URL -e KB_TEST_POSTGRES_USER -e KB_TEST_POSTGRES_PASSWORD -e KB_TEST_POSTGRES_DISPOSABLE -e KB_TEST_POSTGRES_MODE -v "$PWD/backend:/app" -w /app gradle:8.13-jdk21 gradle test --no-daemon --tests '*SearchPostgresIntegrationTest'
      - name: Print migrated PostgreSQL evidence
        run: grep -hE 'PostgreSQL test target:|PostgreSQL version:|PostgreSQL migrated-database check:' backend/build/test-results/test/*.xml | sort -u

  web-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web client
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Validate extension and deployment scripts
        run: cd chrome-extension && npm ci && npm test && npm run build && node -e "const m=JSON.parse(require('fs').readFileSync('.output/chrome-mv3/manifest.json')); if(m.optional_host_permissions || m.host_permissions.some(p => p.includes('*/*'))) throw Error('extension permissions are too broad')" && cd .. && node --check chrome-extension/core.js && node --check chrome-extension/popup.js && node --check chrome-extension/options.js && node --test chrome-extension/core.test.js chrome-extension/google-auth.test.js chrome-extension/api-config.test.js chrome-extension/clockify-validation.test.js && node scripts/check-accessibility.mjs && node scripts/check-security.mjs && node scripts/check-cloudflare-waf.mjs && node scripts/check-smoke-cleanup.mjs && node scripts/check-hardening-status.mjs && bash -n scripts/run-smoke-tests.sh deployment/backup.sh deployment/preflight.sh && docker run --rm -e DOMAIN=localhost -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/deployment/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  smoke:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-only-database-password
      SMOKE_FULL_STACK: "1"
      SMOKE_BACKUP_RESTORE: "1"
    steps:
      - uses: actions/checkout@v4
      # The timer WebSocket probe uses Node's built-in WebSocket (Node 22+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise deployed-shaped stack
        run: ./scripts/run-smoke-tests.sh

  timer-websocket-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Timer WebSocket through the production proxy config
        env:
          TIMER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/timer-websocket-e2e-artifacts
        run: ./scripts/run-timer-websocket-e2e.sh
      - name: Upload timer WebSocket failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timer-websocket-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timer-websocket-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link timer WebSocket failure evidence
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "Failure logs and scrubbed browser evidence are attached to this [workflow run]($RUN_URL) and retained for 14 days." >> "$GITHUB_STEP_SUMMARY"

  line-history-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Note and card line history in a real browser
        env:
          LINE_HISTORY_E2E_ARTIFACT_DIR: ${{ runner.temp }}/line-history-e2e-artifacts
        run: ./scripts/run-line-history-e2e.sh
      - name: Upload line history failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: line-history-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/line-history-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link line history failure evidence
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "Failure logs and scrubbed browser evidence are attached to this [workflow run]($RUN_URL) and retained for 14 days." >> "$GITHUB_STEP_SUMMARY"

  ios-note-document:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS NoteDocument conversion with XCTest on Linux
        run: ./scripts/check-ios-note-document.sh

  line-history-orca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci
      - name: Orca screen reader reads line history
        run: ./scripts/run-line-history-orca.sh

  ios:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Build and run unit tests and the notes UI tests in the simulator
        working-directory: ios
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test -project Know.xcodeproj -scheme Know -destination "id=$device" \
            -resultBundlePath "$RUNNER_TEMP/Know.xcresult" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -only-testing:KnowTests \
            -only-testing:KnowUITests/KnowUITests/testNotesListEditorAndArchiveControlsAreReachable \
            -only-testing:KnowUITests/KnowUITests/testNotesLineHistoryListsEachLineWithItsEditTime
      - name: Keep the test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/Know.xcresult
