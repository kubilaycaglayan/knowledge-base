name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: docker run --rm -v "$PWD/backend:/app" -w /app gradle:8.13-jdk21 gradle test --no-daemon

  web-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web client
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Validate extension and deployment scripts
        run: cd chrome-extension && npm ci && npm test && npm run build && node -e "const m=JSON.parse(require('fs').readFileSync('.output/chrome-mv3/manifest.json')); if(m.optional_host_permissions || m.host_permissions.some(p => p.includes('*/*'))) throw Error('extension permissions are too broad')" && cd .. && node --check chrome-extension/core.js && node --check chrome-extension/popup.js && node --check chrome-extension/options.js && node --test chrome-extension/core.test.js chrome-extension/google-auth.test.js chrome-extension/api-config.test.js chrome-extension/clockify-validation.test.js && node scripts/check-accessibility.mjs && node scripts/check-security.mjs && node scripts/check-smoke-cleanup.mjs && bash -n scripts/run-smoke-tests.sh deployment/backup.sh deployment/preflight.sh && docker run --rm -e DOMAIN=localhost -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/deployment/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  smoke:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-only-database-password
      SMOKE_FULL_STACK: "1"
      SMOKE_BACKUP_RESTORE: "1"
    steps:
      - uses: actions/checkout@v4
      # The timer WebSocket probe uses Node's built-in WebSocket (Node 22+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise deployed-shaped stack
        run: ./scripts/run-smoke-tests.sh

  timer-websocket-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Timer WebSocket through the production proxy config
        run: ./scripts/run-timer-websocket-e2e.sh

  line-history-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Note and card line history in a real browser
        run: ./scripts/run-line-history-e2e.sh

  ios-note-document:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS NoteDocument conversion with XCTest on Linux
        run: ./scripts/check-ios-note-document.sh

  line-history-orca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci
      - name: Orca screen reader reads line history
        run: ./scripts/run-line-history-orca.sh

  ios:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Build and run unit tests and the notes UI tests in the simulator
        working-directory: ios
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test -project Know.xcodeproj -scheme Know -destination "id=$device" \
            -resultBundlePath "$RUNNER_TEMP/Know.xcresult" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -only-testing:KnowTests \
            -only-testing:KnowUITests/KnowUITests/testNotesListEditorAndArchiveControlsAreReachable \
            -only-testing:KnowUITests/KnowUITests/testNotesLineHistoryListsEachLineWithItsEditTime
      - name: Keep the test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/Know.xcresult
