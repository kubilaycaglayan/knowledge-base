name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: docker run --rm -v "$PWD/backend:/app" -w /app gradle:8.13-jdk21 gradle test --no-daemon

  web-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web client
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Validate extension and deployment scripts
        run: cd chrome-extension && npm ci && npm test && npm run build && node -e "const m=JSON.parse(require('fs').readFileSync('.output/chrome-mv3/manifest.json')); if(m.optional_host_permissions || m.host_permissions.some(p => p.includes('*/*'))) throw Error('extension permissions are too broad')" && cd .. && node --check chrome-extension/core.js && node --check chrome-extension/popup.js && node --check chrome-extension/options.js && node --test chrome-extension/core.test.js chrome-extension/google-auth.test.js chrome-extension/api-config.test.js chrome-extension/clockify-validation.test.js && node scripts/check-accessibility.mjs && node scripts/check-security.mjs && node scripts/check-smoke-cleanup.mjs && bash -n scripts/run-smoke-tests.sh deployment/backup.sh deployment/preflight.sh && docker run --rm -e DOMAIN=localhost -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/deployment/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile && docker run --rm -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  smoke:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-only-database-password
      SMOKE_FULL_STACK: "1"
      SMOKE_BACKUP_RESTORE: "1"
    steps:
      - uses: actions/checkout@v4
      # The timer WebSocket probe uses Node's built-in WebSocket (Node 22+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise deployed-shaped stack
        run: ./scripts/run-smoke-tests.sh

  timer-websocket-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Timer WebSocket through the production proxy config
        run: ./scripts/run-timer-websocket-e2e.sh
