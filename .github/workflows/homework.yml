name: homework-artifacts

on:
  push:
    branches: ['homework/datatalksclub-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    if: startsWith(github.ref, 'refs/heads/homework/datatalksclub-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm --prefix mcp-server ci --ignore-scripts
      - run: npm --prefix mcp-server run verify
      - run: node scripts/check-security.mjs
      - run: node scripts/check-cloudflare-waf.mjs
      - run: bash -n mcp-server/export-openapi.sh && sh -n agent-hooks/pre-commit
