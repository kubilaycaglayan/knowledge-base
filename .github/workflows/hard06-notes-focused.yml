name: HARD-06 note UI probes

on:
  push:
    branches:
      - feature/hard-06-ios-validation
  workflow_dispatch:

jobs:
  notes-ui:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Run focused Notes UI probes
        run: |
          mkdir -p harden-tests/artifacts
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project ios/Know.xcodeproj \
            -scheme Know \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath "$PWD/harden-tests/artifacts/HARD06-notes.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -only-testing:KnowTests/NotesTests/testSaveFailureSetsFailedStateAndRecoveryMessage \
            -only-testing:KnowUITests/KnowUITests/testNotesCreateEditArchiveRestorePersistsAcrossWorkspaceNavigationInMemoryFixture \
            -only-testing:KnowUITests/KnowUITests/testNotesSaveFailureKeepsDraftAndOffersRetry
      - name: Keep simulator result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard06-notes-${{ github.run_id }}
          path: harden-tests/artifacts/HARD06-notes.xcresult
          if-no-files-found: warn
          retention-days: 14
