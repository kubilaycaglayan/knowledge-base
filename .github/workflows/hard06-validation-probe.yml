name: HARD-06 macOS validation probe

on:
  push:
    branches: [feature/hard-06-ios-validation]
    paths:
      - .github/workflows/hard06-validation-probe.yml
      - ios/**
      - harden-tests/milestones/06-*

permissions:
  contents: read

jobs:
  ios-validation:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install XcodeGen and generate project
        working-directory: ios
        run: brew install xcodegen && xcodegen --version && xcodegen generate --spec project.yml
      - name: Run complete Know scheme on an iPhone simulator
        run: |
          mkdir -p harden-tests/artifacts
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcrun simctl list devices available
          xcodebuild test \
            -project ios/Know.xcodeproj \
            -scheme Know \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath "$PWD/harden-tests/artifacts/Know.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Retain Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard06-ios-${{ github.run_id }}
          path: harden-tests/artifacts/Know.xcresult
          if-no-files-found: warn
          retention-days: 30
