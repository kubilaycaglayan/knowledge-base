name: HARD-06 Keychain signing diagnostic

on:
  push:
    branches: [feature/hard-06-ios-validation]
    paths:
      - .github/workflows/hard06-keychain-probe.yml

permissions:
  contents: read

jobs:
  keychain-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record host versions
        run: |
          sw_vers
          xcodebuild -version
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Run Keychain unit test with simulator ad hoc signing
        run: |
          mkdir -p harden-tests/artifacts
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project ios/Know.xcodeproj \
            -scheme Know \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath "$PWD/harden-tests/artifacts/Keychain.xcresult" \
            -only-testing:KnowTests/KnowTests/testKeychainPersistsReplacesAndDeletesSession \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Retain diagnostic result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard06-keychain-${{ github.run_id }}
          path: harden-tests/artifacts/Keychain.xcresult
          if-no-files-found: warn
          retention-days: 30
