<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a22" media="(prefers-color-scheme: dark)" />
    <title>API Settings · Knowledge Base</title>
  </head>
  <body class="options-page">
    <main>
      <header class="extension-header"><span class="brand" aria-label="Knowledge Base" translate="no">knowledge<span>.</span>base</span><span class="eyebrow">EXTENSION</span></header>
      <p class="eyebrow">CONNECTION</p><h1>API Settings</h1>
      <p class="lede">Configure the shared Knowledge Base API used by this extension.</p>
      <label for="api">API base URL</label>
      <input id="api" name="apiBase" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://knowledge.example.com/api/v1…" />
      <button id="save">Save API URL</button>
      <p id="status" class="settings-status" role="status" aria-live="polite" tabindex="-1"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
