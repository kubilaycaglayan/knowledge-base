<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Know timer settings</title>
  </head>
  <body>
    <main>
      <h1>know<span>.</span></h1>
      <p>Configure the shared Know API used by this extension.</p>
      <label for="api">API base URL</label>
      <input id="api" type="url" autocomplete="url" placeholder="https://know.example.com/api/v1" />
      <button id="save">Save API URL</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
