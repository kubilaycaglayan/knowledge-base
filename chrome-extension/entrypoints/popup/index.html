<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a22" media="(prefers-color-scheme: dark)" />
    <title>Timer · Knowledge Base</title>
  </head>
  <body>
    <main>
      <header class="extension-header"><span class="brand" aria-label="Knowledge Base" translate="no">knowledge<span>.</span>base</span><div class="header-actions"><button id="settings-menu-toggle" class="icon-button" type="button" aria-label="Open settings menu" aria-expanded="false" aria-haspopup="menu" aria-controls="settings-menu"><span aria-hidden="true">⚙</span></button><div id="settings-menu" class="settings-menu" role="menu" hidden><button id="options" class="menu-button" type="button" role="menuitem">API Settings…</button><button id="logout" class="menu-button danger" type="button" role="menuitem">Sign out</button></div></div></header>
      <p id="loading" class="loading-state" role="status" aria-live="polite">Loading…</p>
      <section id="auth" hidden>
        <h1>Sign In</h1><p class="lede">Connect the timer to your private workspace.</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="you@example.com…" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password…" />
        <button id="login">Sign In</button>
        <button id="google-login" class="secondary" type="button">Continue with Google</button>
      </section>
      <section id="workspace" hidden>
        <p id="status" role="status" aria-live="polite">No active timer</p>
        <label for="path">Path</label>
        <select id="path" name="path" autocomplete="off"><option value="">Select a path</option></select>
        <label for="label">Labels</label>
        <div id="selected-labels" class="label-chips" aria-live="polite"></div>
        <select id="label" name="labelPicker" autocomplete="off" aria-describedby="label-help"></select>
        <small id="label-help">Choose a label to add it. Select × on a chip to remove it.</small>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2" autocomplete="off" placeholder="For example, review project notes…"></textarea>
        <button id="toggle">Start timer</button>
        <section class="history" aria-labelledby="history-title">
          <p class="eyebrow">HISTORY</p><h2 id="history-title">Recent Sessions</h2>
          <div id="sessions"><p class="empty">Loading sessions…</p></div>
        </section>
      </section>
      <p id="error" role="alert" tabindex="-1"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
