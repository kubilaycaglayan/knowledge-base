<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Know timer</title>
  </head>
  <body>
    <main>
      <h1>know<span>.</span></h1>
      <section id="auth">
        <p>Sign in to connect this timer</p>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Email" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
        <button id="login">Sign in</button>
      </section>
      <section id="workspace" hidden>
        <p id="status" role="status" aria-live="polite">No active timer</p>
        <label for="path">Path</label>
        <select id="path"><option value="">Select a path</option></select>
        <label for="item">Item</label>
        <select id="item"><option value="">Select an item (optional)</option></select>
        <label for="description">Description</label>
        <input id="description" placeholder="What are you working on?" />
        <button id="toggle">Start timer</button>
        <button id="logout" class="secondary">Sign out</button>
      </section>
      <button id="options" class="secondary">API settings</button>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
