<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Timer · Knowledge Base</title><link rel="stylesheet" href="popup.css"></head><body><main><header class="extension-header"><span class="brand" aria-label="Knowledge Base" translate="no">knowledge<span>.</span>base</span><span class="eyebrow">TIMER</span></header><section id="auth"><h1>Sign In</h1><p class="lede">Connect the timer to your private workspace.</p><label for="email">Email</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="you@example.com…"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password…"><button id="login">Sign In</button><button id="google-login" class="secondary" type="button">Continue with Google</button></section><section id="workspace" hidden><p id="status" role="status" aria-live="polite">No active timer</p><label for="path">Path</label><select id="path" name="path" autocomplete="off"><option value="">Select a path</option></select><label for="label">Labels</label><select id="label" name="labels" multiple size="4" autocomplete="off" aria-describedby="label-help"></select><small id="label-help">Hold Ctrl/⌘ to select multiple labels.</small><label for="description">Description</label><textarea id="description" name="description" rows="2" autocomplete="off" placeholder="For example, review project notes…"></textarea><button id="toggle">Start timer</button><button id="logout" class="secondary">Sign out</button><section class="history" aria-labelledby="history-title"><p class="eyebrow">HISTORY</p><h2 id="history-title">Recent Sessions</h2><div id="sessions"></div></section></section><button id="options" class="secondary">API Settings…</button><p id="error" role="alert" tabindex="-1"></p></main><script src="api-config.js"></script><script src="core.js"></script><script src="google-auth.js"></script><script src="popup.js"></script></body></html>
