<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Know timer</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>know<span>.</span></h1><section id="auth"><p>Sign in to connect this timer.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="Email"><label for="password">Password</label><input id="password" type="password" autocomplete="off" placeholder="Password"><button id="login">Sign in</button><button id="google-login" class="secondary" type="button">Continue with Google</button></section><section id="workspace" hidden><p id="status" role="status" aria-live="polite">No active timer</p><label for="path">Path</label><select id="path"><option value="">Select a path</option></select><label for="item">Items</label><select id="item" multiple size="4" aria-describedby="item-help"></select><small id="item-help">Hold Ctrl/Cmd to select multiple items.</small><label for="description">Description</label><textarea id="description" rows="2" autocomplete="off" placeholder="What are you working on?"></textarea><button id="toggle">Start timer</button><button id="logout" class="secondary">Sign out</button><section class="history" aria-labelledby="history-title"><h2 id="history-title">Recent sessions</h2><div id="sessions"></div></section></section><button id="options" class="secondary">API settings</button><p id="error" role="alert"></p></main><script src="core.js"></script><script src="google-auth.js"></script><script src="popup.js"></script></body></html>
