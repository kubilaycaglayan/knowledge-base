spring:
  session:
    store-type: none
    timeout: 15m
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/know}
    username: ${DATABASE_USERNAME:know}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
app:
  jwt-secret: ${JWT_SECRET:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5177}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  openai-oauth:
    enabled: ${OPENAI_OAUTH_ENABLED:false}
    issuer: ${OPENAI_OAUTH_ISSUER:http://localhost:8080}
    client-id: ${OPENAI_OAUTH_CLIENT_ID:knowledge-base-openai}
    client-secret: ${OPENAI_OAUTH_CLIENT_SECRET:}
    redirect-uris: ${OPENAI_OAUTH_REDIRECT_URIS:https://chatgpt.com/connector_platform_oauth_redirect}
    domain-challenge: ${OPENAI_DOMAIN_CHALLENGE:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
