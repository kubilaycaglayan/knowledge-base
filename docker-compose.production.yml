name: knowledge-base-production

services:
  db:
    ports: !override ["127.0.0.1:${DB_PROD_PORT:-15433}:5432"]
  api:
    ports: !override ["127.0.0.1:${API_PROD_PORT:-18082}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: production

  proxy:
    ports: !override ["127.0.0.1:${PROXY_PROD_PORT:-19080}:80"]

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-know}
      PGUSER: ${POSTGRES_USER:-know}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-168}
    volumes:
      - ./backups:/backups
      - ./deployment/backup-loop.sh:/usr/local/bin/knowledge-base-backup-loop:ro
    entrypoint: ["/usr/local/bin/knowledge-base-backup-loop"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Production-only safety overlay. The database volume is external so Compose
# cannot remove it during normal production lifecycle commands.
volumes:
  know-db:
    name: knowledge-base_know-db
    external: true
  caddy-data:
    name: knowledge-base_caddy-data
    external: true
  caddy-config:
    name: knowledge-base_caddy-config
    external: true
