services:
  api:
    build: !reset null
    image: gradle:8.13-jdk21
    working_dir: /app
    command:
      - sh
      - -c
      - |
        ./gradlew classes --no-daemon
        ./gradlew classes --continuous --no-daemon &
        compiler_pid=$$!
        trap 'kill "$$compiler_pid" 2>/dev/null || true' EXIT
        exec ./gradlew bootRun --no-daemon
    volumes:
      - ./backend:/app
      - gradle-cache:/home/gradle/.gradle
  web:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose: ["5177"]
  proxy:
    environment:
      WEB_UPSTREAM: web:5177

volumes:
  gradle-cache: {}
  frontend-node-modules: {}
