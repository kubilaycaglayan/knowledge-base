name: knowledge-base-dev

services:
  db:
    cpuset: "0-3,6-9"
    cpus: 0.5
    mem_limit: 1g
    ports: !override ["127.0.0.1:${DB_DEV_PORT:-15432}:5432"]
  api:
    cpuset: "0-3,6-9"
    cpus: 2.0
    mem_limit: 3g
    build: !reset null
    image: gradle:8.13-jdk21
    environment:
      BACKEND_HOT_RELOAD: ${BACKEND_HOT_RELOAD:-0}
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ "$${BACKEND_HOT_RELOAD:-0}" = "1" ]; then
          ./gradlew classes --continuous &
          compiler_pid=$$!
          trap 'kill "$$compiler_pid" 2>/dev/null || true' EXIT
        fi
        exec ./gradlew bootRun
    ports: !override ["127.0.0.1:${API_DEV_PORT:-8080}:8080"]
    volumes:
      - ./backend:/app
      - gradle-cache:/home/gradle/.gradle
  web:
    cpuset: "0-3,6-9"
    cpus: 1.0
    mem_limit: 1.5g
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose: ["5177"]
  extension:
    cpuset: "0-3,6-9"
    cpus: 0.5
    mem_limit: 768m
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 43127"
    environment:
      KNOW_API_BASE: ${KNOW_API_BASE:-}
      CHROME_EXTENSION_KEY: ${CHROME_EXTENSION_KEY:-}
      WXT_USE_POLLING: "1"
    ports: !override ["127.0.0.1:${EXTENSION_DEV_PORT:-43127}:43127"]
    volumes:
      - ./chrome-extension:/app
      - extension-node-modules:/app/node_modules
      - ./chrome-extension/.output:/app/.output
    restart: unless-stopped
  proxy:
    cpuset: "0-3,6-9"
    cpus: 0.1
    mem_limit: 128m
    ports: !override ["127.0.0.1:${PROXY_DEV_PORT:-3000}:80"]
    environment:
      WEB_UPSTREAM: web:5177

volumes:
  know-db:
    name: knowledge-base-dev_know-db
    external: true
  gradle-cache: {}
  frontend-node-modules: {}
  extension-node-modules: {}
