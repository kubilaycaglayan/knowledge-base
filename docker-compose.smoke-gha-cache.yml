services:
  api:
    build:
      cache_from:
        - type=gha,scope=knowledge-base-smoke-api
        - type=gha,scope=${SMOKE_BUILD_CACHE_SCOPE:-knowledge-base-smoke}-api
      cache_to:
        - type=gha,scope=${SMOKE_BUILD_CACHE_SCOPE:-knowledge-base-smoke}-api,mode=max
  web:
    build:
      cache_from:
        - type=gha,scope=knowledge-base-smoke-web
        - type=gha,scope=${SMOKE_BUILD_CACHE_SCOPE:-knowledge-base-smoke}-web
      cache_to:
        - type=gha,scope=${SMOKE_BUILD_CACHE_SCOPE:-knowledge-base-smoke}-web,mode=max
